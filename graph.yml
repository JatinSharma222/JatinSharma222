name: Update Graph
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: python3 gen_graph.py
      - run: git config user.name github-actions && git config user.email actions@github.com && git add contribution-graph.svg && git commit -m "chore: update contribution graph" && git push
